name: ✨ Feature Request
description: Suggest a new feature or improvement
labels: [enhancement]
body:
  - type: textarea
    id: feature
    attributes:
      label: "Describe the feature"
      description: "What would you like to see added?"
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: "Why is it useful?"
      description: "What problem does it solve?"
    validations:
      required: true
