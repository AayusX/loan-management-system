name: 🐛 Bug Report
description: Report a bug so it can be fixed
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: "What happened?"
      description: "A clear description of the bug."
      placeholder: "When I try to ..., the app ..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: "Expected behavior"
      description: "What did you expect to happen?"
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: "Steps to reproduce"
      placeholder: "1. Go to ...  2. Click ...  3. See error"
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: "Environment"
      description: "OS / browser / version where it occurred"
    validations:
      required: false
